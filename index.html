<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Town – Places in the City Game</title>
  <meta name="description" content="Juego para aprender los lugares de la ciudad en inglés (3º-4º primaria)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1 class="title">🏙️ My Town</h1>
    <p class="subtitle">Places in the city</p>

    <div class="modes" id="modes">
      <button class="mode-btn active" data-mode="learn">📖 Learn</button>
      <button class="mode-btn" data-mode="listen">👂 Listen</button>
      <button class="mode-btn" data-mode="look">👀 Read</button>
    </div>

    <div class="board" id="board"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
